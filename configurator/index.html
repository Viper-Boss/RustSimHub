<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13282a"><title>RustSimHub 恢复配置器</title><link rel="manifest" href="./manifest.webmanifest"><style>body{font:16px system-ui;background:#13282a;color:#edf8f6;margin:0}main{max-width:900px;padding:20px;margin:auto;overflow-wrap:anywhere}label{display:block;margin:12px 0}input{display:block;box-sizing:border-box;width:100%;font:inherit;padding:10px}button{font:inherit;min-height:44px;max-width:100%;white-space:normal;margin:4px;padding:8px}button:focus-visible,input:focus-visible{outline:3px solid #67e7c4;outline-offset:2px}li{margin:16px 0}p{white-space:pre-wrap}</style></head><body><main><h1>恢复配置器</h1><p>仅限已通过原可信管理渠道提前登记的恢复身份。生产认证后端由主线安装；本页不批准身份、不接管所有者。</p><p id="state" role="status" aria-live="polite"></p><label>可信渠道核对的完整设备公钥（64 个小写十六进制字符）<input id="pin" maxlength="64" autocomplete="off" spellcheck="false"></label><button id="connect" type="button" disabled>点击选择并连接设备</button><button id="disconnect" type="button" disabled>仅断开本地会话</button><label>Wi-Fi 名称<input id="ssid" autocomplete="off"></label><label>Wi-Fi 密码<input id="password" type="password" autocomplete="off" maxlength="64"></label><button id="begin" type="button" disabled>试连（尚未保存）</button><button id="confirm" type="button" disabled>明确确认保存</button><button id="cancel" type="button" disabled>明确取消本次试连</button><h2>本设备的原请求</h2><p>丢回复、刷新、断线后只查询原请求；not_found 也不是未执行证明。停止本地等待不会撤销设备已提交操作。页面隐藏时不查询。</p><ul id="requests"></ul><h2>离线资源</h2><p id="offline" role="status">首次离线需要此前成功缓存；生产后端未安装时不提供设备功能。</p><button id="update" type="button">无会话和未确认请求时请求更新</button><p>密码只保留在本次输入和调用的内存中，断开或隐藏页面会清空输入；不能声称安全擦除 JavaScript 内存。更新不自动刷新或重新提交请求。</p></main><script type="module" src="./src/app.js"></script></body></html>
