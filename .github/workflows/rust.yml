name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Toolchain version
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Rootfs tooling fixtures
        run: |
          sh -n tools/rootfs/scripts/build-rootfs.sh tools/recovery-fastboot-probe.sh
          python3 -m unittest discover -s tools/rootfs/scripts -p test_rootfs.py
      - name: Board helper isolated fixtures
        run: sudo -n python3 -m unittest discover -s tools/system -p 'test_*.py'
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Check production feature set
        run: cargo check -p rustsimhub-core --no-default-features --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
