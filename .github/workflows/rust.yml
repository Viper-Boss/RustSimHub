name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native toolchain and libraries
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          sudo apt-get update -q
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      - name: Native audio and fixed platform routes
        run: cargo test --manifest-path native/audio-alsa/Cargo.toml --locked
      - name: Native lint
        run: cargo clippy --manifest-path native/audio-alsa/Cargo.toml --all-targets --locked -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Toolchain version
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Rootfs tooling fixtures
        run: |
          sh -n tools/rootfs/scripts/build-rootfs.sh tools/recovery-fastboot-probe.sh
          python3 -m unittest discover -s tools/rootfs/scripts -p test_rootfs.py
      - name: Board helper isolated fixtures
        run: sudo -n python3 -m unittest discover -s tools/system -p 'test_*.py'
      - name: Browser fixture runtime
        run: node --version
      - name: Web identity and first-owner proof
        run: node tools/test-web-proof.mjs
      - name: Web audio lifecycle and authorization
        run: node tools/test-web-media.mjs
      - name: Web one-click call operation safety
        run: node tools/test-web-call-test.mjs
      - name: Web configuration indicator ordering
        run: node tools/test-web-indicator.mjs
      - name: Web network diagnostics and monthly policy
        run: node tools/test-web-network.mjs
      - name: Web event catch-up and retry lifecycle
        run: node tools/test-web-event-sync.mjs
      - name: Web SMS recycle bin and uncertain writes
        run: node tools/test-web-sms-management.mjs
      - name: PON diagnostic reference and error paths
        run: python3 tools/test-pon-dump-review.py
      - name: Read-only recovery helper fixtures
        run: |
          sh -n tools/recovery/watch-edl-capture.sh
          python3 -m unittest discover -s tools/recovery -p 'test_*.py'
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Check production feature set
        run: cargo check -p rustsimhub-core --no-default-features --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
