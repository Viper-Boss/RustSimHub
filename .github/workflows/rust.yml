name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native toolchain and libraries
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          sudo apt-get update -q
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      - name: Native audio and fixed platform routes
        run: cargo test --manifest-path native/audio-alsa/Cargo.toml --locked
      - name: Native lint
        run: cargo clippy --manifest-path native/audio-alsa/Cargo.toml --all-targets --locked -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Toolchain version
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Rootfs tooling fixtures
        run: |
          sh -n tools/rootfs/scripts/build-rootfs.sh tools/recovery-fastboot-probe.sh
          python3 -m unittest discover -s tools/rootfs/scripts -p test_rootfs.py
      - name: Board helper isolated fixtures
        run: sudo -n python3 -m unittest discover -s tools/system -p 'test_*.py'
      - name: Browser fixture runtime
        run: node --version
      - name: Web identity and first-owner proof
        run: node tools/test-web-proof.mjs
      - name: Web audio lifecycle and authorization
        run: node tools/test-web-media.mjs
      - name: Web one-click call operation safety
        run: node tools/test-web-call-test.mjs
      - name: Web one-click incoming call safety
        run: node tools/test-web-incoming-call-test.mjs
      - name: Web configuration indicator ordering
        run: node tools/test-web-indicator.mjs
      - name: Web network diagnostics and monthly policy
        run: node tools/test-web-network.mjs
      - name: Web Wi-Fi catalogue and explicit selection
        run: node tools/test-web-wifi.mjs
      - name: Web event catch-up and retry lifecycle
        run: node tools/test-web-event-sync.mjs
      - name: Web SMS recycle bin and uncertain writes
        run: node tools/test-web-sms-management.mjs
      - name: Web daily SMS and durable submission
        run: node tools/test-web-daily-sms.mjs
      - name: Web simplified one-click test center
        run: node tools/test-web-test-center.mjs
      - name: Web daily calls and bounded ownership
        run: node tools/test-web-daily-phone.mjs
      - name: Web signed session continuation
        run: node tools/test-web-session.mjs
      - name: PON diagnostic reference and error paths
        run: python3 tools/test-pon-dump-review.py
      - name: Read-only recovery helper fixtures
        run: |
          sh -n tools/recovery/watch-edl-capture.sh
          python3 -m unittest discover -s tools/recovery -p 'test_*.py'
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Isolated AP material preparation CLIs
        run: |
          cargo build -p rustsimhub-core -p rustsimhub-edge -p rustsimhub-setup-ap --locked
          sudo -n python3 tools/test-setup-ap-material.py --core target/debug/rustsimhub-core --edge target/debug/rustsimhub-edge --ap target/debug/rustsimhub-setup-ap --edge-user "$(id -un)"
      - name: Isolated forwarding Root and worker IPC
        run: |
          cargo build -p rustsimhub-core --features dev-fixtures --locked
          sudo -n python3 tools/test-forwarding-worker-ipc.py --core target/debug/rustsimhub-core
      - name: Real forwarding worker DNS TLS and bounded stop
        run: |
          cargo build -p rustsimhub-forwarder --locked
          sudo -n unshare --net python3 tools/test-forwarding-worker-process.py --core target/debug/rustsimhub-core --worker target/debug/rustsimhub-forwarder
      - name: Real forwarding systemd credentials and full cgroup stop
        run: |
          cargo build -p rustsimhub-forwarder --features dev-fixtures --locked
          sudo -n unshare --net python3 tools/test-forwarding-supervisor.py --core target/debug/rustsimhub-core --worker target/debug/rustsimhub-forwarder
      - name: Check production feature set
        run: cargo check -p rustsimhub-core --no-default-features --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
