name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native toolchain and libraries
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          sudo apt-get update -q
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      - name: Native audio and fixed platform routes
        run: cargo test --manifest-path native/audio-alsa/Cargo.toml --locked
      - name: Native lint
        run: cargo clippy --manifest-path native/audio-alsa/Cargo.toml --all-targets --locked -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Toolchain version
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Rootfs tooling fixtures
        run: |
          sh -n tools/rootfs/scripts/build-rootfs.sh tools/recovery-fastboot-probe.sh
          python3 -m unittest discover -s tools/rootfs/scripts -p test_rootfs.py
      - name: Committed ARM source and build manifest fixtures
        run: |
          sh -n tools/wsl-build-committed.sh
          python3 tools/test-arm-build-manifest.py
          python3 -O tools/test-arm-build-manifest.py
      - name: Board helper isolated fixtures
        run: sudo -n python3 -m unittest discover -s tools/system -p 'test_*.py'
      - name: Browser fixture runtime
        run: node --version
      - name: Web identity and first-owner proof
        run: node tools/test-web-proof.mjs
      - name: Web audio lifecycle and authorization
        run: node tools/test-web-media.mjs
      - name: Web one-click call operation safety
        run: node tools/test-web-call-test.mjs
      - name: Web one-click incoming call safety
        run: node tools/test-web-incoming-call-test.mjs
      - name: Web configuration indicator ordering
        run: node tools/test-web-indicator.mjs
      - name: Web network diagnostics and monthly policy
        run: node tools/test-web-network.mjs
      - name: Web Wi-Fi catalogue and explicit selection
        run: node tools/test-web-wifi.mjs
      - name: Web finite AP Wi-Fi configuration and recovery
        run: |
          node tools/test-web-ap-wifi.mjs
          node tools/test-web-setup.mjs
      - name: Web event catch-up and retry lifecycle
        run: node tools/test-web-event-sync.mjs
      - name: Web SMS recycle bin and uncertain writes
        run: node tools/test-web-sms-management.mjs
      - name: Web daily SMS and durable submission
        run: node tools/test-web-daily-sms.mjs
      - name: Web simplified one-click test center
        run: node tools/test-web-test-center.mjs
      - name: Web Owner forwarding configuration and receipt recovery
        run: |
          node tools/test-web-forwarding.mjs
          node tools/test-web-forwarding-history.mjs
      - name: Web daily calls and bounded ownership
        run: node tools/test-web-daily-phone.mjs
      - name: Web signed session continuation
        run: node tools/test-web-session.mjs
      - name: Web owner pairing approval and revocation
        run: |
          node tools/test-web-clients.mjs
          node tools/test-web-nas-bridge.mjs
      - name: PON diagnostic reference and error paths
        run: python3 tools/test-pon-dump-review.py
      - name: Read-only recovery helper fixtures
        run: |
          sh -n tools/recovery/watch-edl-capture.sh
          python3 -m unittest discover -s tools/recovery -p 'test_*.py'
      - name: Read-only field snapshot
        run: |
          sh -n tools/field/rsh-readonly-snapshot.sh
          python3 -m unittest discover -s tools/field -p 'test_*.py'
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Forwarding actual filesystem ENOSPC in a bounded private tmpfs
        run: |
          cargo test -p rustsimhub-forwarder --lib --all-features --locked --no-run --message-format=json > /tmp/rustsimhub-forwarder-test-artifacts.json
          sudo -n python3 tools/test-forwarding-storage-full.py --cargo-artifacts /tmp/rustsimhub-forwarder-test-artifacts.json
      - name: Signed legacy and forwarding application groups
        run: |
          cargo build -p rustsimhub-update --locked
          sudo -n unshare --net python3 tools/test-update-state-inspection.py --updater target/debug/rustsimhub-update
          cargo test -p rustsimhub-update --lib --all-features --locked --no-run --message-format=json > /tmp/rustsimhub-update-test-artifacts.json
          sudo -n unshare --net setpriv --no-new-privs python3 tools/test-metadata-process.py --cargo-artifacts /tmp/rustsimhub-update-test-artifacts.json
          sudo -n unshare --net setpriv --bounding-set=-kill --no-new-privs python3 tools/test-metadata-process.py --cargo-artifacts /tmp/rustsimhub-update-test-artifacts.json --missing-kill
          sudo -n unshare --net python3 tools/test-maintenance-observation.py --updater target/debug/rustsimhub-update
          sudo -n unshare --net python3 tools/test-signed-application-formats.py --updater target/debug/rustsimhub-update
          python3 tools/test-development-application-packager.py
      - name: Optional updater indicator under actual thread exhaustion
        run: |
          cargo build -p rustsimhub-update --example indicator-resource --locked
          sudo -n python3 tools/test-update-indicator-resource.py --fixture target/debug/examples/indicator-resource
      - name: Separate signed setup AP maintenance material
        run: |
          python3 tools/test-setup-ap-package.py
          python3 tools/test-setup-ap-install.py
          sudo -n python3 tools/test-setup-ap-units.py
      - name: Isolated AP material preparation CLIs
        run: |
          cargo build -p rustsimhub-core -p rustsimhub-edge -p rustsimhub-setup-ap -p rustsimhub-core-launcher --locked
          sudo -n python3 tools/test-setup-ap-material.py --core target/debug/rustsimhub-core --edge target/debug/rustsimhub-edge --ap target/debug/rustsimhub-setup-ap --edge-user "$(id -un)"
      - name: Finite Core launcher with real service UID and historical fallback
        run: sudo -n python3 tools/test-core-launcher.py --launcher target/debug/rustsimhub-core-launcher
      - name: Bounded AP first-install and rollback in disposable chroot
        run: sudo -n python3 tools/test-setup-ap-install-chroot.py --core target/debug/rustsimhub-core --edge target/debug/rustsimhub-edge --ap target/debug/rustsimhub-setup-ap --launcher target/debug/rustsimhub-core-launcher
      - name: Production upgrade compatibility and readonly data observations
        run: |
          export RUSTSIMHUB_BUILD_SOURCE_SHA256="$(git archive --format=tar HEAD | sha256sum | cut -d ' ' -f1)"
          cargo build -p rustsimhub-core -p rustsimhub-forwarder -p rustsimhub-core-launcher --no-default-features --locked
          python3 tools/test-upgrade-compatibility.py --launcher target/debug/rustsimhub-core-launcher --core target/debug/rustsimhub-core --worker target/debug/rustsimhub-forwarder
      - name: Isolated forwarding Root and worker IPC
        run: |
          cargo build -p rustsimhub-core --features dev-fixtures --locked
          sudo -n python3 tools/test-forwarding-worker-ipc.py --core target/debug/rustsimhub-core
      - name: Real forwarding worker DNS TLS hard crash and bounded stop
        run: |
          cargo build -p rustsimhub-forwarder --locked
          python3 tools/test-forwarding-inspection.py --worker target/debug/rustsimhub-forwarder
          sudo -n unshare --net python3 tools/test-forwarding-worker-process.py --core target/debug/rustsimhub-core --worker target/debug/rustsimhub-forwarder
      - name: Real forwarding systemd credentials and full cgroup stop
        run: |
          cargo build -p rustsimhub-forwarder --features dev-fixtures --locked
          sudo -n unshare --net python3 tools/test-forwarding-supervisor.py --core target/debug/rustsimhub-core --worker target/debug/rustsimhub-forwarder
      - name: Real Owner forwarding service coordination
        run: |
          sudo apt-get update -q
          sudo apt-get install -y polkitd
          sudo -n unshare --net python3 tools/test-forwarding-supervisor.py --core target/debug/rustsimhub-core --worker target/debug/rustsimhub-forwarder --managed
      - name: Real Owner OFF during DNS TLS HTTP and late acknowledgement
        run: |
          for phase in dns tls http late_ack; do
            sudo -n unshare --net python3 tools/test-forwarding-supervisor.py --core target/debug/rustsimhub-core --worker target/debug/rustsimhub-forwarder --managed --close-at "$phase"
          done
      - name: Check production feature set
        run: cargo check -p rustsimhub-core --no-default-features --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
