name: Progress dashboard Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/progress/**'
      - 'tools/progress/**'
      - 'docs/PROGRESS-SCALE.md'
      - '.github/workflows/progress-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete ledger and generated artifacts
        run: |
          python3 tools/progress/build.py --check
          python3 -m unittest discover -s tools/progress -p 'test_*.py' -v
          node tools/progress/test-dashboard.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble public allowlisted artifact
        run: |
          mkdir _site
          cp docs/progress/index.html _site/index.html
          cp docs/progress/progress.json _site/progress.json
          cp docs/progress/remaining.md _site/remaining.md
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
