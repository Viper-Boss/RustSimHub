[package]
name = "rustsimhub-audio-alsa"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
alsa = "=0.12.1"
libc = "0.2"
rustsimhub-media = { path = "../../crates/media" }
tokio = { version = "1", features = ["rt","macros","time","signal"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
