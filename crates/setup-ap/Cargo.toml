[package]
name = "rustsimhub-setup-ap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom = "0.4"
zeroize = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "process", "io-util"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p", "bus-impl"] }
