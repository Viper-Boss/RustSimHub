[package]
name = "rustsimhub-setup-ap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom = "0.4"
zeroize = "1"
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "fs", "time"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "process", "io-util", "signal"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
httparse = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p", "bus-impl"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
