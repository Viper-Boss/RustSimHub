[package]
name = "rustsimhub-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
dev-fixtures = ["dep:ed25519-dalek"]

[dependencies]
rustsimhub-domain = { path = "../domain" }
rustsimhub-wire = { path = "../wire" }
rustsimhub-storage = { path = "../storage" }
rustsimhub-auth = { path = "../auth" }
rustsimhub-policy = { path = "../policy" }
rustsimhub-media = { path = "../media" }
rustsimhub-compat = { path = "../compat" }
rustsimhub-setup-ap = { path = "../setup-ap" }
ed25519-dalek = { version = "2.2", optional = true }

serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2"
sha2 = "0.10"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "signal"] }
fs2 = "0.4"
rustix = { version = "1", features = ["process","fs","net"] }
getrandom = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
base64 = "=0.23.1"
time = { version = "0.3.55", features = ["formatting"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
zbus = { version = "5.19", default-features = false, features = ["tokio","p2p","bus-impl"] }
