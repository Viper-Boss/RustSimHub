[package]
name = "rustsimhub-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Explicit isolated-container test only; never auto-run a UID-changing harness
# in the ordinary suite. Still compiled as cfg(test), not a production example.
[[test]]
name = "recovery_kernel_uid"
path = "tests/recovery_kernel_uid.rs"
test = false
required-features = ["recovery-transport", "recovery-grants"]

[[test]]
name = "recovery_application_uid"
path = "tests/recovery_application_uid.rs"
test = false
required-features = ["recovery-transport", "recovery-execution"]

[features]
default = []
dev-fixtures = ["dep:ed25519-dalek"]
recovery-grants = ["rustsimhub-auth/recovery-grants"]
recovery-execution = ["recovery-grants", "rustsimhub-auth/recovery-execution", "dep:uuid"]
recovery-transport = []
secure-session-candidate = ["recovery-transport", "recovery-execution", "rustsimhub-auth/secure-session-candidate", "dep:rustsimhub-recovery-session"]

[[test]]
name = "recovery_secure_uid"
path = "tests/recovery_secure_uid.rs"
test = false
required-features = ["secure-session-candidate"]

[dependencies]
rustsimhub-domain = { path = "../domain" }
rustsimhub-wire = { path = "../wire" }
rustsimhub-storage = { path = "../storage" }
rustsimhub-auth = { path = "../auth" }
rustsimhub-recovery-session = { path = "../recovery-session", optional = true }
rustsimhub-policy = { path = "../policy" }
rustsimhub-media = { path = "../media" }
rustsimhub-compat = { path = "../compat" }
rustsimhub-setup-ap = { path = "../setup-ap" }
rustsimhub-forwarder = { path = "../forwarder" }
ed25519-dalek = { version = "2.2", optional = true }
uuid = { version = "1", optional = true }

serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2"
sha2 = "0.10"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "signal"] }
fs2 = "0.4"
rustix = { version = "1", features = ["process","fs","net","time"] }
getrandom = "0.4"
zeroize = "1"

[dev-dependencies]
rustsimhub-ble = { path = "../ble", features = ["core-channel-candidate"] }
tempfile = "3"
ed25519-dalek = "2.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
base64 = "=0.23.1"
time = { version = "0.3.55", features = ["formatting"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
zbus = { version = "5.19", default-features = false, features = ["tokio","p2p","bus-impl"] }
