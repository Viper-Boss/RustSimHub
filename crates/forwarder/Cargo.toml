[package]
name = "rustsimhub-forwarder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustsimhub-domain = { path = "../domain" }
rustsimhub-storage = { path = "../storage" }
rustsimhub-auth = { path = "../auth" }
rustsimhub-policy = { path = "../policy" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
http = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
fs2 = "0.4"
rustix = { version = "1", features = ["process", "fs"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }
socket2 = { version = "=0.6.5", features = ["all"] }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
