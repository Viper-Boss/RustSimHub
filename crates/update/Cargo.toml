[package]
name = "rustsimhub-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1"
fs2 = "0.4"
rustsimhub-core-launcher = { path = "../core-launcher" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }

[dev-dependencies]
tempfile = "3"
rustsimhub-storage = { path = "../storage" }
rustsimhub-forwarder = { path = "../forwarder" }
