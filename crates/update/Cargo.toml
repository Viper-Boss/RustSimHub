[package]
name = "rustsimhub-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
email-production-candidate = ["rustsimhub-forwarder/smtp-production-candidate", "dep:rustsimhub-policy"]

[dependencies]
rustsimhub-wire = { path = "../wire" }
rustsimhub-policy = { path = "../policy", optional = true }
rustsimhub-forwarder = { path = "../forwarder" }
rustsimhub-storage = { path = "../storage", features = ["recovery-grants", "recovery-execution"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1"
fs2 = "0.4"
rustsimhub-core-launcher = { path = "../core-launcher" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "fs", "thread", "net", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }

[dev-dependencies]
rustsimhub-core = { path = "../core" }
rustsimhub-auth = { path = "../auth" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tempfile = "3"
rustsimhub-storage = { path = "../storage" }
rustsimhub-forwarder = { path = "../forwarder" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
