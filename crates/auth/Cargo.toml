[package]
name = "rustsimhub-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
recovery-grants = ["rustsimhub-storage/recovery-grants"]
recovery-execution = ["recovery-grants", "rustsimhub-storage/recovery-execution", "dep:uuid"]
secure-session-candidate = ["recovery-execution", "dep:rustsimhub-recovery-session"]

[dependencies]
rustsimhub-domain = { path = "../domain" }
rustsimhub-policy = { path = "../policy" }
rustsimhub-storage = { path = "../storage" }
rustsimhub-recovery-session = { path = "../recovery-session", optional = true }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", optional = true }
fs2 = "0.4"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[dev-dependencies]
tempfile = "3"
