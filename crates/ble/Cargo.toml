[package]
name = "rustsimhub-ble"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
nas-bluetooth = ["bluez-advertisement", "dep:rustsimhub-airsim", "tokio/io-util", "tokio/macros", "tokio/net", "tokio/rt", "tokio/signal", "tokio/time"]
default = []
airsim-pairing = ["bluez-advertisement", "dep:rustsimhub-airsim", "dep:x25519-dalek", "dep:zeroize", "dep:getrandom", "dep:libc", "dep:rustix", "dep:serde", "dep:serde_json", "dep:socket2", "tokio/io-util", "tokio/macros", "tokio/net", "tokio/rt", "tokio/signal", "tokio/time"]
product-host-candidate = ["bluez-backend", "core-channel-candidate", "dep:getrandom", "dep:rustix", "tokio/rt", "tokio/macros", "tokio/signal"]
bluez-control = ["dep:zbus", "dep:tokio", "dep:futures-lite"]
bluez-advertisement = ["bluez-control"]
bluez-gatt = ["bluez-peer", "tokio/time"]
bluez-peer = ["bluez-advertisement", "tokio/time"]
bluez-backend = ["bluez-notify-fd"]
bluez-notify-fd = ["bluez-gatt", "dep:socket2", "dep:libc", "tokio/net"]
core-port = ["dep:tokio", "dep:socket2", "dep:rustix", "tokio/net", "tokio/time", "tokio/io-util"]
service = ["bluez-backend", "core-port", "dep:serde", "dep:serde_json", "dep:getrandom", "tokio/rt", "tokio/macros", "tokio/signal"]
core-channel-candidate = ["dep:tokio", "tokio/net", "tokio/io-util", "tokio/time"]

# Default framing/lifecycle stays runtime-free. Control is explicitly injected.
[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
rustsimhub-airsim = { path = "../airsim", optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
zeroize = { version = "1", optional = true }
zbus = { version = "5.19", optional = true, default-features = false, features = ["tokio"] }
tokio = { version = "1", optional = true, features = ["sync"] }
futures-lite = { version = "2", optional = true }
socket2 = { version = "0.6.5", optional = true, features = ["all"] }
libc = { version = "0.2", optional = true }
rustix = { version = "1", optional = true, features = ["process", "fs", "net"] }
getrandom = { version = "0.4", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[[bin]]
name = "rustsimhub-ble"
path = "src/main.rs"
required-features = ["service"]

# Explicit isolated-container fixture; ordinary cargo test never changes UID.
[[test]]
name = "gatt_kernel_uid"
path = "tests/gatt_kernel_uid.rs"
test = false
required-features = ["bluez-notify-fd"]

[[test]]
name = "core_port_uid"
path = "tests/core_port_uid.rs"
test = false
required-features = ["core-port"]
[[bin]]
name="rustsimhub-ble-recovery"
path="src/bin/recovery.rs"
required-features=["product-host-candidate"]

[[bin]]
name = "rustsimhub-airsim-pairing"
path = "src/bin/airsim_pairing.rs"
required-features = ["airsim-pairing"]

[[bin]]
name = "rustsimhub-nas-bluetooth"
path = "src/bin/nas_bluetooth.rs"
required-features = ["nas-bluetooth"]
