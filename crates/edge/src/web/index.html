<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RustSimHub</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main><header><span class="tag">设备管理 · 开发预览</span><h1>RustSimHub</h1><p>短信与电话由棒子独立处理。请先核对设备公钥，再配对当前浏览器。</p></header>
<section><h2>连接与身份</h2><label>设备公钥（通过可信 USB / CLI 核对）<input id="pin" autocomplete="off" maxlength="64" placeholder="64 位十六进制公钥"></label><p id="client-key" class="mono"></p><label><input type="checkbox" id="write-scope">配对时申请短信发送和通话控制</label><div class="actions"><button id="pair">申请配对</button><button id="login">登录已批准的浏览器</button><button id="logout">退出</button></div><p id="notice" role="status">未登录</p></section>
<section><h2>设备状态</h2><div class="actions"><button id="refresh">刷新状态</button><button id="sync">补同步事件</button></div><pre id="status">等待登录</pre><p id="events"></p></section>
<section><h2>短信</h2><div id="inbox"></div><button id="more-inbox">下一页</button><pre id="sms-detail"></pre><label>接收号码<input id="recipient" inputmode="tel" maxlength="32"></label><label>短信内容<textarea id="text" maxlength="2048" rows="3"></textarea></label><button id="prepare-sms">准备发送</button><p>准备后核对内容，点击下方提交。结果不明时只查询，不自动再次发送。</p></section>
<section><h2>电话</h2><p>当前网页只控制呼叫；客户端语音链路尚未接入。</p><div id="calls"></div><button id="more-calls">下一页</button><label>拨出号码<input id="number" inputmode="tel" maxlength="32"></label><button id="prepare-dial">准备拨号</button><label>选择呼叫<select id="call-id"></select></label><div class="actions"><button id="prepare-accept">准备接听</button><button id="prepare-hangup">准备挂断</button></div><label>DTMF 按键<input id="dtmf" maxlength="32" placeholder="0–9、*、#、A–D"></label><button id="prepare-dtmf">准备发送按键</button><p id="lease">没有控制租约</p></section>
<section><h2>当前操作</h2><pre id="pending">没有待处理操作</pre><div class="actions"><button id="submit" disabled>确认提交一次</button><button id="query" disabled>查询操作结果</button><button id="clear" disabled>关闭已完成操作</button></div></section>
<footer>浏览器私钥保存在本机 IndexedDB，登录会话只存在内存。关闭页面后通话按核心租约自动清理。</footer></main></body></html>
