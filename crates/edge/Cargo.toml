[package]
name = "rustsimhub-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustsimhub-wire = { path = "../wire" }
rustsimhub-auth = { path = "../auth" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "sync", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
