[workspace]
members = ["crates/domain", "crates/policy", "crates/auth", "crates/wire", "crates/storage", "crates/core", "crates/ctl", "crates/media", "crates/edge", "crates/update", "crates/recovery", "crates/compat", "crates/status-led", "crates/network-agent", "crates/setup-ap"]
exclude = ["native/audio-alsa"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
