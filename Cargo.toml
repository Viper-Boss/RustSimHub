[workspace]
members = ["crates/domain", "crates/policy", "crates/auth", "crates/wire", "crates/storage", "crates/core", "crates/ctl", "crates/media", "crates/edge", "crates/update", "crates/recovery", "crates/compat", "crates/status-led", "crates/network-agent", "crates/setup-ap", "crates/forwarder", "crates/core-launcher", "crates/mdns", "crates/ble", "crates/usage-stats", "crates/nkn-agent", "crates/recovery-session"]
exclude = ["native/audio-alsa"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Signed application and Root payloads must be checked within the unchanged
# five-second runtime lease. Keep the locked, software-capable SHA-2 backend
# fast even when release tools choose opt=z for the application as a whole.
[profile.release.package."sha2:0.10.9"]
opt-level = 3
