ill="#eef5ff" font-weight="600">运营商通知</text><text x="332" y="480" font-size="12" fill="#91a2bb" font-weight="400">这是一条用于界面预览的虚构服务提醒。</text><text x="849" y="458" font-size="11" fill="#91a2bb" font-weight="400">12:18</text><rect x="279" y="508" width="38" height="38" rx="12" fill="#203548" stroke="#203548"/><text x="291" y="533" font-size="15" fill="#65ddd4" font-weight="600">S</text><text x="332" y="527" font-size="14" fill="#eef5ff" font-weight="600">示例联系人</text><text x="332" y="550" font-size="12" fill="#91a2bb" font-weight="400">一切准备就绪，稍后见。</text><text x="849" y="528" font-size="11" fill="#91a2bb" font-weight="400">昨天</text><rect x="960" y="311" width="400" height="271" rx="16" fill="#111c2e" stroke="#25334a"/><text x="984" y="347" font-size="20" fill="#eef5ff" font-weight="600">电话</text><rect x="1240" y="326" width="91" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="1254" y="346" font-size="12" fill="#65ddd4" font-weight="600">空闲</text><text x="984" y="397" font-size="23" fill="#eef5ff" font-weight="600">随时准备好沟通。</text><text x="984" y="425" font-size="13" fill="#91a2bb" font-weight="400">输入号码，准备发起通话。</text><rect x="984" y="450" width="350" height="43" rx="9" fill="#0b1422" stroke="#25334a"/><text x="1002" y="477" font-size="14" fill="#91a2bb" font-weight="400">请输入电话号码</text><rect x="984" y="511" width="350" height="43" rx="10" fill="#65ddd4" stroke="#65ddd4"/><text x="1104" y="539" font-size="14" fill="#0a101c" font-weight="700">打开拨号盘</text><rect x="257" y="603" width="684" height="174" rx="16" fill="#111c2e" stroke="#25334a"/><text x="281" y="640" font-size="20" fill="#eef5ff" font-weight="600">连接方式</text><text x="281" y="684" font-size="13" fill="#91a2bb" font-weight="400">USB / NAS</text><text x="281" y="717" font-size="18" fill="#91a2bb" font-weight="600">可选桥接</text><text x="497" y="684" font-size="13" fill="#91a2bb" font-weight="400">Wi-Fi</text><text x="497" y="717" font-size="18" fill="#92e5b2" font-weight="600">局域网连接</text><text x="713" y="684" font-size="13" fill="#91a2bb" font-weight="400">NKNGuard</text><text x="713" y="717" font-size="18" fill="#91a2bb" font-weight="600">规划中 · 已关闭</text><text x="281" y="751" font-size="12" fill="#91a2bb" font-weight="400">本地访问与远程访问分别验证。</text><rect x="960" y="603" width="400" height="174" rx="16" fill="#111c2e" stroke="#25334a"/><text x="984" y="640" font-size="20" fill="#eef5ff" font-weight="600">扩展功能</text><text x="984" y="678" font-size="14" fill="#eef5ff" font-weight="400">短信转发</text><text x="1234" y="678" font-size="12" fill="#91a2bb" font-weight="400">规划中</text><text x="984" y="710" font-size="14" fill="#eef5ff" font-weight="400">使用统计</text><text x="1234" y="710" font-size="12" fill="#91a2bb" font-weight="400">单独授权</text><text x="984" y="748" font-size="12" fill="#91a2bb" font-weight="400">每个扩展均有独立开关。</text><text x="258" y="807" font-size="11" fill="#91a2bb" font-weight="400">仅为未来设计预览 · 非当前已交付网页 · 未连接真实设备</text></g></svg>