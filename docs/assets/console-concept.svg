<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="830" viewBox="0 0 1380 830" role="img" aria-labelledby="title desc">
<title id="title">Future desktop console concept</title><desc id="desc">Static future design with fictional messages and metrics. Overview, SMS, phone, network, security and independent extension switches. Not an implemented UI.</desc>
<defs><radialGradient id="glow"><stop stop-color="#1f5862" stop-opacity=".42"/><stop offset="1" stop-color="#0a101c" stop-opacity="0"/></radialGradient></defs>
<rect width="1380" height="830" rx="24" fill="#0a101c"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="34" y="43" font-size="23" fill="#65ddd4" font-weight="700">R / S</text><text x="1195" y="40" font-size="11" fill="#91a2bb" font-weight="400">UI CONCEPT / SAMPLE DATA</text><rect x="20" y="65" width="205" height="735" rx="18" fill="#0d1625" stroke="#25334a"/><text x="42" y="108" font-size="23" fill="#eef5ff" font-weight="700">RustSimHub</text><text x="42" y="133" font-size="10" fill="#91a2bb" font-weight="400">COMMUNICATION CONSOLE</text><rect x="33" y="155" width="179" height="41" rx="9" fill="#183943" stroke="#2c565e"/><text x="49" y="181" font-size="15" fill="#65ddd4" font-weight="600">Overview</text><text x="49" y="235" font-size="15" fill="#91a2bb" font-weight="400">Messages</text><text x="49" y="289" font-size="15" fill="#91a2bb" font-weight="400">Phone</text><text x="49" y="343" font-size="15" fill="#91a2bb" font-weight="400">Network</text><text x="49" y="397" font-size="15" fill="#91a2bb" font-weight="400">Forwarding</text><text x="49" y="451" font-size="15" fill="#91a2bb" font-weight="400">Access &amp; security</text><text x="49" y="505" font-size="15" fill="#91a2bb" font-weight="400">System</text><text x="43" y="715" font-size="12" fill="#91a2bb" font-weight="400">UFI003 / MSM8916</text><rect x="40" y="738" width="156" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="54" y="758" font-size="12" fill="#65ddd4" font-weight="600">Local connection</text><text x="257" y="106" font-size="30" fill="#eef5ff" font-weight="600">Your communication, at a glance.</text><text x="258" y="135" font-size="15" fill="#91a2bb" font-weight="400">A calm home for your SIM, messages and calls.</text><rect x="1204" y="85" width="145" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="1218" y="105" font-size="12" fill="#65ddd4" font-weight="600">Owner session</text><rect x="257" y="164" width="263" height="125" rx="16" fill="#111c2e" stroke="#25334a"/><text x="277" y="194" font-size="11" fill="#91a2bb" font-weight="600">DEVICE</text><text x="277" y="233" font-size="24" fill="#92e5b2" font-weight="600">Online</text><text x="277" y="264" font-size="11" fill="#91a2bb" font-weight="400">UFI003 · local HTTPS</text><rect x="537" y="164" width="263" height="125" rx="16" fill="#111c2e" stroke="#25334a"/><text x="557" y="194" font-size="11" fill="#91a2bb" font-weight="600">SIM / RADIO</text><text x="557" y="233" font-size="24" fill="#65ddd4" font-weight="600">LTE registered</text><text x="557" y="264" font-size="11" fill="#91a2bb" font-weight="400">Example carrier · sample status</text><rect x="817" y="164" width="263" height="125" rx="16" fill="#111c2e" stroke="#25334a"/><text x="837" y="194" font-size="11" fill="#91a2bb" font-weight="600">MESSAGES</text><text x="837" y="233" font-size="24" fill="#eef5ff" font-weight="600">8 unread</text><text x="837" y="264" font-size="11" fill="#91a2bb" font-weight="400">All content shown is fictional</text><rect x="1097" y="164" width="263" height="125" rx="16" fill="#111c2e" stroke="#25334a"/><text x="1117" y="194" font-size="11" fill="#91a2bb" font-weight="600">CELLULAR DATA</text><text x="1117" y="233" font-size="24" fill="#91a2bb" font-weight="600">Off</text><text x="1117" y="264" font-size="11" fill="#91a2bb" font-weight="400">No automatic cellular fallback</text><rect x="257" y="311" width="684" height="271" rx="16" fill="#111c2e" stroke="#25334a"/><text x="280" y="347" font-size="20" fill="#eef5ff" font-weight="600">Recent messages</text><text x="826" y="346" font-size="12" fill="#65ddd4" font-weight="400">View inbox →</text><rect x="279" y="368" width="38" height="38" rx="12" fill="#203548" stroke="#203548"/><text x="291" y="393" font-size="15" fill="#65ddd4" font-weight="600">D</text><text x="332" y="387" font-size="14" fill="#eef5ff" font-weight="600">Demo service</text><text x="332" y="410" font-size="12" fill="#91a2bb" font-weight="400">Your example verification code is 123456.</text><text x="849" y="388" font-size="11" fill="#91a2bb" font-weight="400">14:32</text><rect x="279" y="438" width="38" height="38" rx="12" fill="#203548" stroke="#203548"/><text x="291" y="463" font-size="15" fill="#65ddd4" font-weight="600">C</text><text x="332" y="457" font-size="14" fill="#eef5ff" font-weight="600">Carrier notice</text><text x="332" y="480" font-size="12" fill="#91a2bb" font-weight="400">A fictional service reminder for this preview.</text><text x="849" y="458" font-size="11" fill="#91a2bb" font-weight="400">12:18</text><rect x="279" y="508" width="38" height="38" rx="12" fill="#203548" stroke="#203548"/><text x="291" y="533" font-size="15" fill="#65ddd4" font-weight="600">S</text><text x="332" y="527" font-size="14" fill="#eef5ff" font-weight="600">Sample contact</text><text x="332" y="550" font-size="12" fill="#91a2bb" font-weight="400">Everything is ready. See you later.</text><text x="849" y="528" font-size="11" fill="#91a2bb" font-weight="400">Yesterday</text><rect x="960" y="311" width="400" height="271" rx="16" fill="#111c2e" stroke="#25334a"/><text x="984" y="347" font-size="20" fill="#eef5ff" font-weight="600">Phone</text><rect x="1240" y="326" width="91" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="1254" y="346" font-size="12" fill="#65ddd4" font-weight="600">Idle</text><text x="984" y="397" font-size="23" fill="#eef5ff" font-weight="600">Ready when you are.</text><text x="984" y="425" font-size="13" fill="#91a2bb" font-weight="400">Select a number to prepare a call.</text><rect x="984" y="450" width="350" height="43" rx="9" fill="#0b1422" stroke="#25334a"/><text x="1002" y="477" font-size="14" fill="#91a2bb" font-weight="400">Enter phone number</text><rect x="984" y="511" width="350" height="43" rx="10" fill="#65ddd4" stroke="#65ddd4"/><text x="1104" y="539" font-size="14" fill="#0a101c" font-weight="700">Open dialer</text><rect x="257" y="603" width="684" height="174" rx="16" fill="#111c2e" stroke="#25334a"/><text x="281" y="640" font-size="20" fill="#eef5ff" font-weight="600">Connection paths</text><text x="281" y="684" font-size="13" fill="#91a2bb" font-weight="400">USB / NAS</text><text x="281" y="717" font-size="18" fill="#91a2bb" font-weight="600">Optional bridge</text><text x="497" y="684" font-size="13" fill="#91a2bb" font-weight="400">Wi-Fi</text><text x="497" y="717" font-size="18" fill="#92e5b2" font-weight="600">Local network</text><text x="713" y="684" font-size="13" fill="#91a2bb" font-weight="400">NKNGuard</text><text x="713" y="717" font-size="18" fill="#91a2bb" font-weight="600">Planned · off</text><text x="281" y="751" font-size="12" fill="#91a2bb" font-weight="400">Local access and remote access are verified separately.</text><rect x="960" y="603" width="400" height="174" rx="16" fill="#111c2e" stroke="#25334a"/><text x="984" y="640" font-size="20" fill="#eef5ff" font-weight="600">Extensions</text><text x="984" y="678" font-size="14" fill="#eef5ff" font-weight="400">SMS forwarding</text><text x="1234" y="678" font-size="12" fill="#91a2bb" font-weight="400">Planned</text><text x="984" y="710" font-size="14" fill="#eef5ff" font-weight="400">Usage reporting</text><text x="1234" y="710" font-size="12" fill="#91a2bb" font-weight="400">Opt-in</text><text x="984" y="748" font-size="12" fill="#91a2bb" font-weight="400">Each extension has its own switch.</text><text x="258" y="807" font-size="11" fill="#91a2bb" font-weight="400">DESIGN PREVIEW ONLY · NOT THE CURRENT SHIPPED WEB UI · NO LIVE DEVICE CONNECTION</text></g></svg>