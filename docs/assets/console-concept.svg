<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, sans-serif"><text x="34" y="43" font-size="23" fill="#65ddd4" font-weight="700">R / S</text><text x="1195" y="40" font-size="11" fill="#91a2bb" font-weight="400">未来界面概念 / 示例数据</text><rect x="20" y="65" width="205" height="735" rx="18" fill="#0d1625" stroke="#25334a"/><text x="42" y="108" font-size="23" fill="#eef5ff" font-weight="700">RustSimHub</text><text x="42" y="133" font-size="10" fill="#91a2bb" font-weight="400">独立通信控制台</text><rect x="33" y="155" width="179" height="41" rx="9" fill="#183943" stroke="#2c565e"/><text x="49" y="181" font-size="15" fill="#65ddd4" font-weight="600">总览</text><text x="49" y="235" font-size="15" fill="#91a2bb" font-weight="400">短信</text><text x="49" y="289" font-size="15" fill="#91a2bb" font-weight="400">电话</text><text x="49" y="343" font-size="15" fill="#91a2bb" font-weight="400">网络</text><text x="49" y="397" font-size="15" fill="#91a2bb" font-weight="400">短信转发</text><text x="49" y="451" font-size="15" fill="#91a2bb" font-weight="400">访问与安全</text><text x="49" y="505" font-size="15" fill="#91a2bb" font-weight="400">系统</text><text x="43" y="715" font-size="12" fill="#91a2bb" font-weight="400">UFI003 / MSM8916</text><rect x="40" y="738" width="156" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="54" y="758" font-size="12" fill="#65ddd4" font-weight="600">本地连接</text><text x="257" y="106" font-size="30" fill="#eef5ff" font-weight="600">通信状态，一目了然。</text><text x="258" y="135" font-size="15" fill="#91a2bb" font-weight="400">在同一处管理设备、短信与电话。</text><rect x="1204" y="85" width="145" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="1218" y="105" font-size="12" fill="#65ddd4" font-weight="600">所有者会话</text><rect x="257" y="164" width="263" height="125" rx="16" fill="#111c2e" stroke="#25334a"/><text x="277" y="194" font-size="11" fill="#91a2bb" font-weight="600">设备状态</text><text x="277" y="233" font-size="24" fill="#92e5b2" font-weight="600">在线</tex