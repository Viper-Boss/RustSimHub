<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
<title id="title">Future mobile web concept</title><desc id="desc">Three mobile layouts for overview, inbox and dialing. All data fictional. Responsive web proposal; native mobile app has not been developed.</desc>
<defs><radialGradient id="glow"><stop stop-color="#1f5862" stop-opacity=".42"/><stop offset="1" stop-color="#0a101c" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="840" rx="24" fill="#0a101c"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="46" y="55" font-size="13" fill="#65ddd4" font-weight="600">THE SAME DEVICE. A SMALLER SCREEN.</text><text x="46" y="105" font-size="33" fill="#eef5ff" font-weight="600">Designed to travel with you.</text><text x="46" y="142" font-size="17" fill="#91a2bb" font-weight="400">Responsive web concept / no native app yet</text><rect x="48" y="180" width="360" height="586" rx="30" fill="#111b2c" stroke="#344258"/><rect x="458" y="180" width="360" height="586" rx="30" fill="#111b2c" stroke="#344258"/><rect x="868" y="180" width="360" height="586" rx="30" fill="#111b2c" stroke="#344258"/><text x="76" y="219" font-size="13" fill="#eef5ff" font-weight="600">9:41</text><text x="315" y="219" font-size="12" fill="#91a2bb" font-weight="400">LTE  ▰</text><text x="76" y="267" font-size="27" fill="#eef5ff" font-weight="600">Overview</text><rect x="76" y="285" width="139" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="90" y="305" font-size="12" fill="#65ddd4" font-weight="600">Device online</text><rect x="72" y="336" width="312" height="112" rx="18" fill="#172b38" stroke="#284855"/><text x="92" y="366" font-size="10" fill="#91a2bb" font-weight="600">MY COMMUNICATION DEVICE</text><text x="92" y="402" font-size="27" fill="#eef5ff" font-weight="600">RustSimHub</text><text x="92" y="427" font-size="12" fill="#65ddd4" font-weight="400">Wi-Fi connected · cellular data off</text><rect x="72" y="465" width="150" height="98" rx="16" fill="#111c2e" stroke="#25334a"/><text x="90" y="506" font-size="28" fill="#65ddd4" font-weight="600">8</text><text x="90" y="539" font-size="11" fill="#91a2bb" font-weight="400">Unread messages</text><rect x="234" y="465" width="150" height="98" rx="16" fill="#111c2e" stroke="#25334a"/><text x="252" y="506" font-size="28" fill="#65ddd4" font-weight="600">Idle</text><text x="252" y="539" font-size="11" fill="#91a2bb" font-weight="400">Phone status</text><text x="76" y="602" font-size="19" fill="#eef5ff" font-weight="600">Everything in one place.</text><text x="76" y="633" font-size="13" fill="#91a2bb" font-weight="400">Read messages. Manage calls.</text><text x="76" y="657" font-size="13" fill="#91a2bb" font-weight="400">Choose how your device connects.</text><text x="486" y="219" font-size="13" fill="#eef5ff" font-weight="600">9:41</text><text x="486" y="267" font-size="27" fill="#eef5ff" font-weight="600">Messages</text><rect x="482" y="287" width="312" height="40" rx="10" fill="#0c1422" stroke="#25334a"/><text x="500" y="313" font-size="13" fill="#91a2bb" font-weight="400">Search messages</text><text x="486" y="369" font-size="15" fill="#eef5ff" font-weight="600">Demo service</text><text x="486" y="394" font-size="12" fill="#91a2bb" font-weight="400">Your example code is 123456.</text><path d="M486 411h304" stroke="#25334a"/><text x="486" y="448" font-size="15" fill="#eef5ff" font-weight="600">Carrier notice</text><text x="486" y="473" font-size="12" fill="#91a2bb" font-weight="400">A fictional service reminder.</text><path d="M486 490h304" stroke="#25334a"/><text x="486" y="527" font-size="15" fill="#eef5ff" font-weight="600">Sample contact</text><text x="486" y="552" font-size="12" fill="#91a2bb" font-weight="400">Everything is ready.</text><path d="M486 569h304" stroke="#25334a"/><text x="486" y="606" font-size="15" fill="#eef5ff" font-weight="600">Example sender</text><text x="486" y="631" font-size="12" fill="#91a2bb" font-weight="400">Only sample data appears here.</text><path d="M486 648h304" stroke="#25334a"/><text x="896" y="219" font-size="13" fill="#eef5ff" font-weight="600">9:41</text><text x="896" y="267" font-size="27" fill="#eef5ff" font-weight="600">Phone</text><text x="962" y="323" font-size="20" fill="#91a2bb" font-weight="400">Enter a number</text><circle cx="928" cy="382" r="27" fill="#1c2b40"/><text x="921" y="390" font-size="22" fill="#eef5ff" font-weight="400">1</text><circle cx="1024" cy="382" r="27" fill="#1c2b40"/><text x="1017" y="390" font-size="22" fill="#eef5ff" font-weight="400">2</text><circle cx="1120" cy="382" r="27" fill="#1c2b40"/><text x="1113" y="390" font-size="22" fill="#eef5ff" font-weight="400">3</text><circle cx="928" cy="450" r="27" fill="#1c2b40"/><text x="921" y="458" font-size="22" fill="#eef5ff" font-weight="400">4</text><circle cx="1024" cy="450" r="27" fill="#1c2b40"/><text x="1017" y="458" font-size="22" fill="#eef5ff" font-weight="400">5</text><circle cx="1120" cy="450" r="27" fill="#1c2b40"/><text x="1113" y="458" font-size="22" fill="#eef5ff" font-weight="400">6</text><circle cx="928" cy="518" r="27" fill="#1c2b40"/><text x="921" y="526" font-size="22" fill="#eef5ff" font-weight="400">7</text><circle cx="1024" cy="518" r="27" fill="#1c2b40"/><text x="1017" y="526" font-size="22" fill="#eef5ff" font-weight="400">8</text><circle cx="1120" cy="518" r="27" fill="#1c2b40"/><text x="1113" y="526" font-size="22" fill="#eef5ff" font-weight="400">9</text><circle cx="928" cy="586" r="27" fill="#1c2b40"/><text x="921" y="594" font-size="22" fill="#eef5ff" font-weight="400">*</text><circle cx="1024" cy="586" r="27" fill="#1c2b40"/><text x="1017" y="594" font-size="22" fill="#eef5ff" font-weight="400">0</text><circle cx="1120" cy="586" r="27" fill="#1c2b40"/><text x="1113" y="594" font-size="22" fill="#eef5ff" font-weight="400">#</text><rect x="899" y="644" width="297" height="43" rx="12" fill="#65ddd4" stroke="#65ddd4"/><text x="1003" y="672" font-size="14" fill="#0a101c" font-weight="700">Prepare call</text><text x="78" y="730" font-size="11" fill="#91a2bb" font-weight="400">Home     Messages     Phone     Settings</text><text x="488" y="730" font-size="11" fill="#91a2bb" font-weight="400">Home     Messages     Phone     Settings</text><text x="898" y="730" font-size="11" fill="#91a2bb" font-weight="400">Home     Messages     Phone     Settings</text><text x="48" y="807" font-size="12" fill="#91a2bb" font-weight="400">FUTURE UI CONCEPT · FICTIONAL DATA · RESPONSIVE WEB, NOT 