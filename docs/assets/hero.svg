<g font-family="Segoe UI, Arial, sans-serif"><ellipse cx="1000" cy="150" rx="390" ry="280" fill="url(#glow)"/><rect x="48" y="36" width="142" height="30" rx="15" fill="#142b36" stroke="#284851"/><text x="62" y="56" font-size="12" fill="#65ddd4" font-weight="600">LINUX + RUST</text><text x="48" y="137" font-size="64" fill="#eef5ff" font-weight="700">RustSimHub</text><text x="51" y="182" font-size="24" fill="#65ddd4" font-weight="400">Your SIM. Your device. Your control.</text><text x="51" y="227" font-size="16" fill="#91a2bb" font-weight="400">An independent communication system for MSM8916.</text><text x="51" y="280" font-size="13" fill="#91a2bb" font-weight="600">SMS  /  VOICE  /  LOCAL-FIRST  /  OPTIONAL NAS</text><rect x="858" y="48" width="280" height="224" rx="24" fill="#101e2c" stroke="#345366"/><text x="882" y="83" font-size="12" fill="#91a2bb" font-weight="600">DEVICE / UFI003</text><text x="882" y="133" font-size="25" fill="#eef5ff" font-weight="600">Small device.</text><text x="882" y="169" font-size="25" fill="#65ddd4" font-weight="600">Independent core.</text><rect x="884" y="228" width="11" height="9" rx="3" fill="#65ddd4" stroke="#65ddd4"/><rect x="906" y="221" width="11" height="16" rx="3" fill="#65ddd4" stroke="#65ddd4"/><rect x="928" y="212" width="11" height="25" rx="3" fill="#65ddd4" stroke="#65ddd4"/><rect x="950" y="202" width="11" height="35" rx="3" fill="#65ddd4" stroke="#65ddd4"/><rect x="972" y="191" width="11" height="46" rx="3" fill="#65ddd4" stroke="#65ddd4"/><text x="1020" y="233" font-size="13" fill="#91a2bb" font-weight="400">ARM64</text></g></svg>