<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">RustSimHub — independent SIM communication</title><desc id="desc">Project banner. Linux and Rust user space on MSM8916. SMS, voice and optional NAS integration.</desc>
<defs><radialGradient id="glow"><stop stop-color="#1f5862" stop-opacity=".42"/><stop offset="1" stop-color="#0a101c" stop-opacity="0"/></radialGradient></defs>
