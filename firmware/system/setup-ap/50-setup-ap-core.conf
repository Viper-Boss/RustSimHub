# Candidate joint mode: preserve the managed forwarding UID and existing paths.
[Unit]
After=systemd-tmpfiles-setup.service

[Service]
ExecStart=
ExecStart=/opt/rustsimhub/selected/rustsimhub-core --serve-device-forwarding-managed-setup-ap /run/rustsimhub/core/core.sock 985 /var/lib/rustsimhub-core/state /var/lib/rustsimhub-core/identity /run/rustsimhub/core/media.sock 984 /var/lib/rustsimhub-core/archive /var/lib/rustsimhub-core/access /var/lib/rustsimhub-core/compat /var/lib/rustsimhub-core/journal /var/lib/rustsimhub-core/setup 983 /run/rustsimhub-setup-ap-core /run/rustsimhub-setup-ap-root /var/lib/rustsimhub-core/setup-ap-journal
ReadWritePaths=/run/rustsimhub-setup-ap-core /var/lib/rustsimhub-core/setup-ap-journal
ReadOnlyPaths=/run/rustsimhub-setup-ap-root
