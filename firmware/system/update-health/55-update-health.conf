# Explicit schema6 forwarding candidate profile only; never install by default.
[Service]
ExecStart=
ExecStart=/opt/rustsimhub/selected/rustsimhub-core --enable-update-health-candidate --serve-device-forwarding-managed /run/rustsimhub/core/core.sock 985 /var/lib/rustsimhub-core/state /var/lib/rustsimhub-core/identity /run/rustsimhub/core/media.sock 984 /var/lib/rustsimhub-core/archive /var/lib/rustsimhub-core/access /var/lib/rustsimhub-core/compat /var/lib/rustsimhub-core/journal /var/lib/rustsimhub-core/setup 983
ReadWritePaths=/run/rustsimhub/update-health
