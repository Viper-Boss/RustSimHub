# Explicit same-schema application update health for the existing Setup AP launcher.
[Service]
Environment=RUSTSIMHUB_WEB_UPDATE_HEALTH=1
ReadWritePaths=/run/rustsimhub/update-health
BindReadOnlyPaths=/var/lib/rustsimhub/rustsimhub-v1/system/web-update:/run/rustsimhub/web-update
BindPaths=/opt/rustsimhub/web-update/inbox:/var/lib/rustsimhub-core/update-upload
