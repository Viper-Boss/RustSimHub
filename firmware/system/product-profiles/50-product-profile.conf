# Explicit offline profile material. Never copied to the default overlay.
[Service]
ExecStart=
ExecStart=/usr/libexec/rustsimhub/rustsimhub-core-launcher
ReadOnlyPaths=/etc/rustsimhub/product-profile.json
ReadOnlyPaths=-/etc/rustsimhub/nkn-membership.bin -/run/rustsimhub-nkn-root
ReadWritePaths=-/run/rustsimhub/nkn -/run/rustsimhub/recovery
MemoryMax=@CORE_MEMORY@
TasksMax=@CORE_TASKS@
