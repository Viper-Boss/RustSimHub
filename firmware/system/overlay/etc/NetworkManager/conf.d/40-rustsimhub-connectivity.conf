# Only Wi-Fi connectivity checks; never probe cellular or the USB/NAS link.
[device-rustsimhub-wifi-checks]
match-device=interface-name:wlan0
check-connectivity=yes

[device-rustsimhub-no-other-checks]
match-device=*;except:interface-name:wlan0
check-connectivity=no

[connectivity]
enabled=true
uri=http://network-test.debian.org/nm
response=NetworkManager is online
interval=120
timeout=4
